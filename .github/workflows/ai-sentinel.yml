name: 24/7 Cloudflare Sentinel Audit

on:
  schedule:
    # Puoi tranquillamente farlo girare ogni ora invece che ogni 4, essendo leggerissimo
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  audit_network:
    runs-on: ubuntu-latest

    steps:
      # ==========================
      # 1. CHECKOUT
      # ==========================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================
      # 2. PYTHON
      # ==========================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ==========================
      # 3. DEPENDENCIES (Super Leggere)
      # ==========================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir requests opencv-python-headless

      # ==========================
      # 4. RUN SENTINEL
      # ==========================
      - name: Run Sentinel
        env:
          SENTINEL_KEY: ${{ secrets.SENTINEL_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          python -u scripts/sentinel.py
